name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, build, test, clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install components
        run: rustup component add clippy rustfmt

      - name: Install system dependencies
        run: bash ./scripts/ci/install-system-deps.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: check on MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: Install system dependencies
        run: bash ./scripts/ci/install-system-deps.sh

      - name: Check
        run: cargo check --workspace --all-targets --locked

  e2e-transcribe:
    name: e2e transcription smoke (CPU, tiny.en)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: bash ./scripts/ci/install-system-deps.sh

      # ggml-tiny.en.bin, pinned by SHA-256 (upstream whisper.cpp hash).
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/polyscribe-e2e
          key: polyscribe-e2e-model-v1-921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
          restore-keys: polyscribe-e2e-model-v1-

      - name: Download and verify ggml-tiny.en.bin
        env:
          MODEL_SHA256: 921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
          MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
        run: |
          set -euo pipefail
          model_dir="$HOME/.cache/polyscribe-e2e"
          model_path="$model_dir/ggml-tiny.en.bin"
          mkdir -p "$model_dir"
          # The cache is never trusted: verify the checksum and re-download
          # on any mismatch (corrupt or stale cache entries included).
          if [ -f "$model_path" ] && echo "$MODEL_SHA256  $model_path" | sha256sum -c - >/dev/null 2>&1; then
            echo "Cached model verified (sha256 ok)."
          else
            echo "Downloading ggml-tiny.en.bin (expected sha256 $MODEL_SHA256)."
            rm -f "$model_path"
            curl -fL --retry 3 --connect-timeout 30 -o "$model_path.part" "$MODEL_URL"
            mv "$model_path.part" "$model_path"
            echo "$MODEL_SHA256  $model_path" | sha256sum -c -
          fi

      - name: Run transcription e2e test
        run: |
          export POLYSCRIBE_E2E_MODEL="$HOME/.cache/polyscribe-e2e/ggml-tiny.en.bin"
          cargo test --locked -p polyscribe-cli --test e2e_transcribe -- --nocapture
