[package]
name = "polyscribe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
whisper-rs = { workspace = true }
# UI and progress
cliclack = { workspace = true }
# HTTP downloads + hashing
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }

[features]
# Default: CPU only; no GPU features enabled.
default = []
# GPU backends map to whisper-rs features. Availability is a build-time
# property: a binary built with a GPU feature links the corresponding
# runtime and can use it; without the feature the backend is unavailable.
gpu-cuda = ["whisper-rs/cuda"]
gpu-hip = ["whisper-rs/hipblas"]
