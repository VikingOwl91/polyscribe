[package]
name = "polyscribe-plugin-tubescribe"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "polyscribe-plugin-tubescribe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.43", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1", features = ["full"] }
polyscribe-protocol = { path = "../../crates/polyscribe-protocol" }
